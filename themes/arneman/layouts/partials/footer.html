<!-- Liquid Glass Footer -->
<footer>
  <div class="footer-container">
    <div class="footer-left">
      <div class="footer-title">{{ .Site.Params.author }} — VIDEO EDITOR & 3D ARTIST</div>
      <div class="footer-desc">SPECIALIZING IN UNREAL ENGINE 5.4, OCTANE & KINETIC POST-PRODUCTION</div>
    </div>
    <div class="footer-contact-links">
      <a href="mailto:{{ .Site.Params.email }}" class="footer-contact-link">
        <span>✉</span> {{ .Site.Params.email }}
      </a>
      <a href="tel:{{ .Site.Params.phone }}" class="footer-contact-link">
        <span>☎</span> {{ .Site.Params.phone }}
      </a>
      <a href="{{ .Site.BaseURL }}{{ .Site.Params.resume_path }}" target="_blank" class="footer-contact-link">
        <span>📄</span> Resume (PDF)
      </a>
    </div>
  </div>
</footer>
