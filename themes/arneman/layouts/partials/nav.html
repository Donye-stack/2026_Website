<!-- Liquid Glass Header Dock with Shimmer Refraction -->
<div class="header-wrapper">
  <header class="liquid-glass-dock">
    <a href="{{ .Site.BaseURL }}" class="brand-group">
      <div class="refraction-orb"></div>
      <div>
        <div class="brand-name">DONYE WILSON</div>
        <div class="brand-role-tag">VIDEO EDITOR // 3D MOTION ARTIST</div>
      </div>
    </a>

    <!-- Category Filter Pills -->
    <nav class="filter-pills-nav">
      <button class="filter-btn active" data-filter="all">ALL WORK (10)</button>
      <button class="filter-btn" data-filter="trailers">GAME TRAILERS</button>
      <button class="filter-btn" data-filter="motion">3D WORLDS</button>
      <button class="filter-btn" data-filter="commercial">COMMERCIAL</button>
      <button class="filter-btn" data-filter="shortform">SHORT FORM (9:16)</button>
    </nav>

    <!-- Action Buttons -->
    <div class="header-actions">
      <a href="{{ .Site.BaseURL }}{{ .Site.Params.resume_path }}" target="_blank" class="liquid-btn">
        <span>RESUME PDF</span> ↗
      </a>
      <button class="liquid-btn primary" id="btn-open-brief">
        <span>+</span> COMMISSION REEL
      </button>
    </div>
  </header>
</div>
