{{ partial "head.html" . }}
<body>

  <main style="padding-top: 130px; max-width: 900px; margin: 0 auto; min-height: 70vh;">
    <div class="showcase-meta-card" style="margin-top: 20px;">
      <h1 class="project-hero-title" style="font-size: 32px; margin-bottom: 16px;">{{ .Title }}</h1>
      <div class="project-narrative">

      <div style="margin-top: 24px;">
        <a href="{{ .Site.BaseURL }}" class="liquid-btn">← Back to Portfolio</a>

  {{ partial "modal.html" . }}
  {{ partial "footer.html" . }}
  {{ partial "js.html" . }}
